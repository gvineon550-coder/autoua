name: Check URLs

on:
  push:
    branches: [ main, master ]
    paths:
      - 'check_urls.txt'
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-urls
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"
  PLAYLIST_MAX_ITEMS: "700"   # под rus.m3u (~649 каналов)
  CHECK_SEGMENTS: "0"         # только манифест — быстро
  JITTER_MIN: "0.1"
  JITTER_MAX: "0.5"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install curl_cffi
      - run: python check_urls.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔍 URL check report"
