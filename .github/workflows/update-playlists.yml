name: Auto-update playlists

# --- Триггеры ---
on:
  push:
    branches: [ main, master ]
    paths:
      - '**.m3u'
      - '**.m3u8'
      - 'headers.json'
  schedule:
    - cron: '0 4 * * 1'      # каждый понедельник в 04:00 UTC — полная проверка
  workflow_dispatch:          # ручной запуск

# --- Права ---
permissions:
  contents: write             # нужно для git-auto-commit-action

# --- Защита от параллельных прогонов ---
# Если запушить 3 коммита за минуту — выполнится только последний.
# Экономит Actions-минуты и не перегружает CDN параллельными запросами.
concurrency:
  group: playlist-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # страховка от зависания

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: pip install curl_cffi

      # FULL_CHECK=true только при расписании и ручном запуске.
      # При пуше — QUICK: проверяются только новые URL.
      - name: Run pipeline
        env:
          FULL_CHECK: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python detect_headers.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto: update playlists"

      # --- Артефакты при падении: помогают разобраться, что случилось ---
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            alive.json
            headers.json
            alive_cache.json
          retention-days: 7

      # --- Уведомление в Telegram при падении (работает, только если секреты заданы) ---
      - name: Notify Telegram on failure
        if: failure() && env.TELEGRAM_TOKEN != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ Playlist update FAILED
            Repo: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
